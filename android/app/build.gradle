plugins {
    id "com.android.application"
}

android {
    namespace "com.framestudio.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.framestudio.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Pure Android SDK & WebView — zero external Maven dependencies or legacy 4KB native .so libs
}
